[package]
name = "opensmell"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["OpenSmell Contributors"]
repository = "https://github.com/opensmell/opensmell"
description = "MOX e-nose feature extraction, anomaly detection, and calibration engine"

[dependencies]
ndarray = "0.16"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[dev-dependencies]
env_logger = "0.11"
approx = "0.5"
