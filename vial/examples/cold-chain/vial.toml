[vial]
id = "org.opensmell.cold-chain"
name = "Cold Chain Spoilage Watch"
version = "1.0.0"
tier = "recipe"
noses = ["@opensmell"]
license = "MIT"
min_runtime = "0.2.0"

[contributes]
sources = ["serial.generic"]
transforms = ["baseline.select", "features.kinetics"]
views = ["olfactogram", "change-log"]

[capabilities]
network = []
sensors = ["session.readings", "session.env"]
storage = ["result.annotations"]

[claims]
provides = ["spoilage-risk"]
evidence = ["doi:10.1016/j.snb.2014.07.087"]
limits = ["sealed storage only", "chemical change vs baseline — validate on your product"]

[pricing]
model = "free"
