[vial]
id = "org.opensmell.leak-alarm"
name = "Dedicated Leak Alarm"
version = "1.0.0"
tier = "recipe"
noses = ["@opensmell"]
license = "MIT"
min_runtime = "0.2.0"

[contributes]
sources = ["serial.generic"]
transforms = ["baseline.select", "changepoint"]
views = ["olfactogram", "change-log"]

[capabilities]
network = []
sensors = ["session.readings"]
storage = ["result.annotations"]

[claims]
provides = ["leak-alarm"]
evidence = ["doi:10.1021/cr068121q"]
limits = ["one dedicated target sensor", "NOT a replacement for certified toxic-gas detectors"]

[pricing]
model = "free"
