# Vial manifest — the single source of truth.
# Docs + LLM index: https://opensmell.org/llms.txt
[vial]
id = "__ID__"
name = "__NAME__"
version = "0.1.0"
tier = "wasm"
noses = ["@yourhandle"]
license = "MIT"
min_runtime = "0.2.0"

[contributes]
transforms = ["custom.my-transform"]
views = ["olfactogram"]

[capabilities]
# Least privilege: exact hostnames only.
network = []
sensors = ["session.readings"]
storage = ["result.annotations"]

[claims]
# TODO: what decision does this Vial make? If it provides one, you MUST cite evidence.
provides = ["change-detection"]
evidence = ["doi:10.1021/cr068121q"]
limits = ["TODO: state the envelope this claim holds in"]

[pricing]
model = "free"
